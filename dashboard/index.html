<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Gateway Review</title>
  <style>
    body{font:16px system-ui;max-width:1000px;margin:3rem auto;padding:0 1rem;color:#172033;background:#f5f7fb}
    h1{font-size:1.7rem}.card{background:white;padding:1.2rem;border-radius:12px;margin:1rem 0;box-shadow:0 2px 12px #17203310}
    input,button{font:inherit;padding:.65rem;border:1px solid #ccd3e0;border-radius:6px}#token{display:block;width:100%;max-width:32rem;box-sizing:border-box;margin-top:.35rem}button{cursor:pointer;background:#173a70;color:white;margin:.25rem}button:disabled{opacity:.5;cursor:not-allowed}
    .muted{color:#68738a}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:1rem;border-radius:8px}
    .row{border-top:1px solid #e4e8ef;padding:.8rem 0}.status{margin-left:.5rem}
  </style>
</head>
<body>
  <h1>Agent Gateway · Approval Review</h1>
  <p class="muted">The reviewer token stays in this tab's memory and is never saved to local storage.</p>
  <section class="card">
    <label>Reviewer token <input id="token" type="password" autocomplete="off" size="52"></label>
    <button id="load-approvals">Load pending approvals</button>
    <button id="load-audit">Load audit events</button>
    <button id="export-audit" disabled>Download audit JSON</button>
    <span id="status" class="muted status" aria-live="polite"></span>
  </section>
  <section class="card"><h2>Pending approvals</h2><div id="items">Enter your reviewer token to load requests.</div></section>
  <section class="card"><h2>Recent audit events</h2><div id="audit-items">Enter your reviewer token to load events.</div></section>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let auditExport=null;
    async function api(path,method='GET',body){
      const response=await fetch(path,{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
      const data=await response.json();
      if(!response.ok)throw Error(data.message||data.error||response.status);
      return data;
    }
    async function loadApprovals(){
      $('status').textContent='Loading approvals…';
      try{
        const data=await api('/v1/approvals');
        $('items').innerHTML=data.items.length?data.items.map(item=>`<article class="row"><b>${esc(item.tool)}</b> · action ${esc(item.action_id)}<pre>${esc(JSON.stringify({principal:item.principal,task_id:item.task_id,arguments:item.arguments,destination:item.review_snapshot?.destination_id,content:item.review_snapshot?.content,content_hash:item.review_snapshot?.content_hash},null,2))}</pre><button data-id="${esc(item.approval_id)}" data-decision="approve">Approve</button><button data-id="${esc(item.approval_id)}" data-decision="reject">Reject</button></article>`).join(''):'No approvals are waiting.';
        $('status').textContent=`Loaded ${data.items.length} approval(s).`;
      }catch(error){$('status').textContent=error.message;}
    }
    async function loadAudit(){
      $('status').textContent='Loading audit events…';
      auditExport=null;$('export-audit').disabled=true;
      try{
        const data=await api('/v1/audit/events');
        auditExport={exported_at:new Date().toISOString(),events:data.items};
        $('export-audit').disabled=false;
        $('audit-items').innerHTML=data.items.length?data.items.map(event=>`<article class="row"><b>${esc(event.event)}</b> · ${esc(event.actor)}<div class="muted">${esc(new Date(event.at*1000).toLocaleString())} · trace ${esc(event.trace_id)}</div><pre>${esc(JSON.stringify({action_id:event.action_id,details:event.details},null,2))}</pre></article>`).join(''):'No audit events are available.';
        $('status').textContent=`Loaded ${data.items.length} audit event(s).`;
      }catch(error){$('status').textContent=error.message;}
    }
    $('load-approvals').onclick=loadApprovals;
    $('load-audit').onclick=loadAudit;
    $('token').addEventListener('input',()=>{auditExport=null;$('export-audit').disabled=true;});
    $('export-audit').onclick=()=>{
      if(!auditExport)return;
      const blob=new Blob([JSON.stringify(auditExport,null,2)],{type:'application/json'});
      const link=document.createElement('a');
      link.href=URL.createObjectURL(blob);
      link.download=`gateway-audit-${new Date().toISOString().replaceAll(':','-')}.json`;
      link.click();
      setTimeout(()=>URL.revokeObjectURL(link.href),0);
    };
    $('items').onclick=async event=>{
      const button=event.target.closest('button[data-id]');
      if(!button)return;
      try{await api('/v1/approvals/'+encodeURIComponent(button.dataset.id)+'/decision','POST',{decision:button.dataset.decision});await loadApprovals();}
      catch(error){$('status').textContent=error.message;}
    };
  </script>
</body>
</html>
